services:
  - type: web
    name: suade-addin
    env: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      # Web workspace (suadelaw.com/app) Google sign-in. Set both in the
      # Render dashboard -> Environment (see WEBAPP_SETUP.md).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
